# Build and push the image only; Terraform deploys it.
# Run from the repository root:
#   gcloud builds submit . --config=terraform/cloudbuild-image.yaml \
#     --region=REGION --service-account=projects/PROJECT/serviceAccounts/BUILD_SA \
#     --substitutions=_IMAGE=REGION-docker.pkg.dev/PROJECT/ccaas-sync-repo/ccaas-sync-service:TAG
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', '${_IMAGE}', '.']
images:
  - '${_IMAGE}'
options:
  # A custom build service account needs either a logs bucket or Cloud Logging only.
  logging: CLOUD_LOGGING_ONLY
