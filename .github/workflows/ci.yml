name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests and dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-fund
      - run: npm test
      - name: Audit production dependencies (fail on high or critical)
        run: npm audit --omit=dev --audit-level=high

  container:
    name: Container build and startup smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build -t ccaas-bulk-sync:ci .
      - name: Start container (production mode, authentication on)
        run: |
          docker run -d --name app -p 8080:8080 \
            -e K_SERVICE=ci \
            -e IAP_AUDIENCE=/projects/0/global/backendServices/0 \
            -e SERVICE_ACCOUNT=ci@example.iam.gserviceaccount.com \
            ccaas-bulk-sync:ci
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          echo "Container did not start:"; docker logs app; exit 1
      - name: Smoke test
        run: |
          set -e
          check() { # method path expected
            code=$(curl -s -o /dev/null -w '%{http_code}' -X "$1" "http://localhost:8080$2")
            echo "$1 $2 -> $code (expected $3)"
            [ "$code" = "$3" ]
          }
          check GET  /                 200
          check GET  /output.css       200
          check GET  /app.js           200
          check GET  /app-render.js    200
          check GET  /vendor/vue.runtime.global.prod.js 200
          check GET  /api/config       401
          check POST /api/config       401
          check POST /api/sync         401
          # A forged IAP header must be rejected.
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'x-goog-iap-jwt-assertion: a.b.c' http://localhost:8080/api/config)
          echo "forged IAP JWT -> $code (expected 401)"; [ "$code" = "401" ]
          # Security headers and a strict CSP (no third-party origins).
          headers=$(curl -sI http://localhost:8080/)
          echo "$headers" | grep -i '^content-security-policy:.*default-src .self.' 
          if echo "$headers" | grep -i '^content-security-policy:' | grep -qiE 'unpkg|https?://'; then echo "CSP allows a third-party origin"; exit 1; fi
          if echo "$headers" | grep -i '^content-security-policy:' | grep -qi 'unsafe-'; then echo "CSP allows unsafe-eval or unsafe-inline"; exit 1; fi
          echo "$headers" | grep -i '^x-content-type-options: nosniff'
          # The container must not run as root.
          uid=$(docker exec app id -u); echo "container uid: $uid"; [ "$uid" != "0" ]
      - name: Container logs
        if: always()
        run: docker logs app || true

  terraform:
    name: Terraform format and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
