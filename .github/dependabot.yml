version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing newly published versions (supply-chain safety).
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind 4 changes the CSS build and configuration; migrate deliberately.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait before proposing newly published versions (supply-chain safety).
    cooldown:
      default-days: 7
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Stay on the Node.js LTS line; move to the next LTS major deliberately.
      - dependency-name: node
        update-types: [version-update:semver-major]
    # Wait before proposing newly published versions (supply-chain safety).
    cooldown:
      default-days: 7
